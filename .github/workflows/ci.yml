name: CI

on:
  push:
    branches: [main, develop, review/campaign-recovery-20260926]
  pull_request:
    branches: [main, develop, review/campaign-recovery-20260926]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-contracts:
    name: Repository contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate canonical project state
        run: python3 scripts/ci/verify-current-state.py
      - name: Validate pinned CSV release surface
        run: python3 scripts/ci/verify-release-manifest.py docs/saas/releases/CRM_CSV_RECOVERY_2026-10-17.json
      - name: Validate CRM CSV UX and phone normalization candidate
        run: python3 scripts/ci/verify-release-manifest.py docs/saas/releases/CRM_CSV_UX_PHONE_NORMALIZATION_2026-10-18.json
      - name: Validate CRM contacts list recovery candidate
        run: python3 scripts/ci/verify-release-manifest.py docs/saas/releases/CRM_CONTACTS_LIST_RECOVERY_2026-10-19.json
      - name: Validate active immutable deployment record
        run: python3 scripts/ci/verify-deployment-record.py
      - name: Validate deployment socket ownership relations
        run: python3 scripts/ci/test-verify-deployment-record.py
      - name: Validate active OBS-2 credential rotation record
        run: python3 scripts/ci/verify-credential-rotation-record.py docs/saas/releases/OBS2_OAUTH_STATE_SECRET_ROTATION_2026-10-18_DEPLOYED.json
      - name: Reject stale active release documentation
        run: python3 scripts/ci/verify-documentation-freshness.py
      - name: Validate canonical deployment operating model
        run: python3 scripts/ci/verify-deployment-operating-model.py
      - name: Keep artifact engineering as break-glass only
        run: python3 scripts/ci/verify-artifact-release-standard.py
      - name: Reject retired normal release route
        run: python3 scripts/ci/verify-normal-release.py
      - name: Validate deploy impact classifier
        run: bash scripts/test-deploy-impact-matrix.sh
      - name: Validate PM2 definition namespace boundary
        run: python3 -m unittest -v scripts/ci/test-pm2-definition-control.py
      - name: Validate canonical PM2 binding materialization
        run: python3 -m unittest -v scripts/ci/test-pm2-binding-materialize.py
      - name: Validate versioned frontend-only activation transaction
        run: python3 -m unittest -v scripts/ci/test-frontend-only-activation.py
      - name: Validate canonical frontend finalization continuation
        run: python3 -m unittest -v scripts/ci/test-frontend-finalization-continuation.py
      - name: Validate canonical fixed-current finalization continuation
        run: python3 -m unittest -v scripts/ci/test-fixed-current-finalization-continuation.py
      - name: Validate minimal deploy driver transaction
        run: python3 scripts/ci/test-converta-deploy.py
      - name: Validate deterministic external release producer
        run: python3 scripts/ci/test-converta-release.py
      - name: Validate mandatory generation retirement
        run: python3 -m unittest -v scripts/ci/test-generation-retirement.py
      - name: Validate aggregate deploy-preparation admission
        run: PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest -v scripts/ci/test-deploy-preparation-admission.py
      - name: Validate retention evidence collection
        run: python3 -m unittest -v scripts/test_operational_retention_report.py scripts/test_retention_evidence_collector.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
      - name: Install pinned PM2 for isolated definition proof
        run: npm install --prefix "$RUNNER_TEMP/re7-pm2-definition-tools" --no-save --ignore-scripts pm2@6.0.14
      - name: Prove candidate and rollback in isolated PM2
        run: >-
          python3 scripts/ci/verify-pm2-definition-isolated.py
          --pm2 "$RUNNER_TEMP/re7-pm2-definition-tools/node_modules/.bin/pm2"

  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Enforce the existing ESLint debt ceiling
        run: bash scripts/ci/check-eslint-baseline.sh
      - run: npm run build

  backend:
    name: Backend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/whatsapp-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/whatsapp-agent/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npm run build
      - name: WhatsApp Meta tenant runtime DB-first regressions
        run: >-
          node --import tsx --test
          src/config/authenticatedTenantJsonSource.test.ts
          src/config/tenantOperationalConfig.test.ts
          src/config/tenantJsonRetirementSelection.test.ts
          src/whatsapp/tenantMetaRuntimeConfig.test.ts
          src/whatsapp/tenantMetaReactiveOutboundGate.test.ts
          src/whatsapp/tenantMetaRuntimeContract.test.ts
          src/conversation/acceptedHandoffTransition.test.ts

  csv-critical:
    name: CSV recovery and tenant isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: retention_lab
        ports:
          - 55781:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d retention_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55781/retention_lab
    defaults:
      run:
        working-directory: apps/whatsapp-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/whatsapp-agent/package-lock.json
      - name: Install frontend dependencies for path aliases
        working-directory: .
        run: npm ci
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - name: Create isolated tenant operational config database
        env:
          PGPASSWORD: postgres
        run: >-
          psql -h 127.0.0.1 -p 55781 -U postgres -d retention_lab
          -v ON_ERROR_STOP=1 -c 'CREATE DATABASE re7_config_persistence_ci'
      - name: Tenant operational config backfill and retirement contracts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55781/re7_config_persistence_ci
          APP_AUTH_SECRET: synthetic-consent-ci-secret
          STORAGE_MODE: postgres
          CONV_STATE_READ_SOURCE: postgres
        run: |
          npm run db:deploy
          node --import tsx --test src/channels/channelAccountMigrationPlan.test.ts
          node --import tsx --test src/channels/channelAccountMigrationScripts.test.ts
          node --import tsx --test src/config/tenantOperationalConfigMigrationPlan.test.ts
          node --import tsx --test src/config/tenantOperationalConfigScripts.test.ts
      - name: Consent management persistence, idempotency and Automation isolation
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55781/re7_config_persistence_ci
          APP_AUTH_SECRET: synthetic-consent-ci-secret
        run: |
          node --import tsx --test --test-name-pattern "integrated WEB consent|consent reprocessing" \
            src/conversation/automationOwnActivity.test.ts
          node --import tsx --test src/inbox/messageVisibility.test.ts
          node --import tsx --test --test-name-pattern "management-only consent" \
            src/http/automationConversations.test.ts
      - name: Backend durable-operation and multi-tenant tests
        run: >-
          node --import tsx --test
          src/crm/crmCsvImportOperation.postgres.test.ts
          src/crm/crmContactsCursor.test.ts
          src/crm/crmContactsTotals.test.ts
          src/crm/crmContactsReadModelContract.test.ts
      - name: CRM phone identity and import normalization tests
        run: >-
          node --import tsx --test
          src/crm/crmWhatsappIdentity.test.ts
          src/crm/crmContactUpsert.test.ts
      - name: CRM cursor filters, RBAC and tenant isolation routes
        run: node --import tsx --test src/http/crmCapabilityRoutes.test.ts
      - name: Template media validation, Meta contract and tenant isolation
        run: >-
          node --import tsx --test
          src/templates/templateComponents.test.ts
          src/templates/templateMediaStorage.test.ts
          src/templates/templateMediaUploadAdmission.test.ts
          src/templates/campaignMediaAdmission.test.ts
          src/templates/templateMediaRoutesContract.test.ts
          src/templates/templateMediaPersistence.postgres.test.ts
          src/templates/templateMediaAccountUpload.postgres.test.ts
          src/services/templateProviderSubmissionGate.test.ts
          src/meta/metaTemplateMedia.test.ts
          src/meta/templateStatusReconciliation.test.ts
          src/meta/tenantMetaAppId.test.ts
          src/campaigns/campaignSeedPrivacy.test.ts
      - name: Template media behavioral HTTP authorization and multipart tests
        run: >-
          node --import tsx --test
          --test-name-pattern "campaign availability protects|template media routes enforce|template media multipart rejects|superadmin configures App ID|admin onboarding code exchange|media submit without tenant App ID|template submission reconciliation"
          src/http/campaignsFeatureRoutes.test.ts
      - name: Frontend timeout, re-entry and CRM CSV UX contract tests
        working-directory: .
        run: |
          apps/whatsapp-agent/node_modules/.bin/tsx --test \
            src/lib/crmImportRecovery.test.ts \
            src/lib/crmContactsInitialLoad.test.ts \
            src/lib/crmContactsCursorHistory.test.ts \
            src/lib/screenProcessing.test.ts \
            src/lib/templateMediaOverlay.test.ts \
            src/lib/templateMediaUx.test.ts \
            src/lib/campaignDrafts.test.ts \
            src/lib/inboxRealtimeTimeline.test.ts
          apps/whatsapp-agent/node_modules/.bin/tsx --test \
            --test-name-pattern "CRM contacts expose progress|CRM initial list|CRM list uses cursor" \
            src/app/app/crm/crmPageContract.test.ts
      - name: Campaign media composer and lifecycle contracts
        working-directory: .
        run: >-
          apps/whatsapp-agent/node_modules/.bin/tsx --test
          src/app/app/campaigns/campaignsPageContract.test.ts
          src/lib/campaignComposerLifecycle.test.ts
          src/lib/campaignPresentation.test.ts
          apps/whatsapp-agent/src/campaigns/campaignLifecyclePresentation.test.ts

