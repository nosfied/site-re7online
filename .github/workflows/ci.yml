name: CI

on:
  push:
    branches: [main, develop, review/campaign-recovery-20260926]
  pull_request:
    branches: [main, develop, review/campaign-recovery-20260926]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-contracts:
    name: Repository contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate canonical project state
        run: python3 scripts/ci/verify-current-state.py
      - name: Validate pinned CSV release surface
        run: python3 scripts/ci/verify-release-manifest.py docs/saas/releases/CRM_CSV_RECOVERY_2026-10-17.json
      - name: Validate CRM CSV UX and phone normalization candidate
        run: python3 scripts/ci/verify-release-manifest.py docs/saas/releases/CRM_CSV_UX_PHONE_NORMALIZATION_2026-10-18.json
      - name: Validate CRM contacts list recovery candidate
        run: python3 scripts/ci/verify-release-manifest.py docs/saas/releases/CRM_CONTACTS_LIST_RECOVERY_2026-10-19.json
      - name: Validate active immutable deployment record
        run: python3 scripts/ci/verify-deployment-record.py
      - name: Validate deployment socket ownership relations
        run: python3 scripts/ci/test-verify-deployment-record.py
      - name: Validate active OBS-2 credential rotation record
        run: python3 scripts/ci/verify-credential-rotation-record.py docs/saas/releases/OBS2_OAUTH_STATE_SECRET_ROTATION_2026-10-18_DEPLOYED.json
      - name: Reject stale active release documentation
        run: python3 scripts/ci/verify-documentation-freshness.py
      - name: Keep artifact engineering as break-glass only
        run: python3 scripts/ci/verify-artifact-release-standard.py
      - name: Reject retired normal release route
        run: python3 scripts/ci/verify-normal-release.py
      - name: Validate deploy impact classifier
        run: bash scripts/test-deploy-impact-matrix.sh
      - name: Validate PM2 definition namespace boundary
        run: python3 -m unittest -v scripts/ci/test-pm2-definition-control.py
      - name: Validate minimal deploy driver transaction
        run: python3 scripts/ci/test-converta-deploy.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
      - name: Install pinned PM2 for isolated definition proof
        run: npm install --prefix "$RUNNER_TEMP/re7-pm2-definition-tools" --no-save --ignore-scripts pm2@6.0.14
      - name: Prove candidate and rollback in isolated PM2
        run: >-
          python3 scripts/ci/verify-pm2-definition-isolated.py
          --pm2 "$RUNNER_TEMP/re7-pm2-definition-tools/node_modules/.bin/pm2"

  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Enforce the existing ESLint debt ceiling
        run: bash scripts/ci/check-eslint-baseline.sh
      - run: npm run build

  backend:
    name: Backend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/whatsapp-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/whatsapp-agent/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npm run build

  csv-critical:
    name: CSV recovery and tenant isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: retention_lab
        ports:
          - 55781:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d retention_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55781/retention_lab
    defaults:
      run:
        working-directory: apps/whatsapp-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/whatsapp-agent/package-lock.json
      - name: Install frontend dependencies for path aliases
        working-directory: .
        run: npm ci
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - name: Backend durable-operation and multi-tenant tests
        run: >-
          node --import tsx --test
          src/crm/crmCsvImportOperation.postgres.test.ts
          src/crm/crmContactsCursor.test.ts
          src/crm/crmContactsTotals.test.ts
          src/crm/crmContactsReadModelContract.test.ts
      - name: CRM phone identity and import normalization tests
        run: >-
          node --import tsx --test
          src/crm/crmWhatsappIdentity.test.ts
          src/crm/crmContactUpsert.test.ts
      - name: CRM cursor filters, RBAC and tenant isolation routes
        run: node --import tsx --test src/http/crmCapabilityRoutes.test.ts
      - name: Template media validation, Meta contract and tenant isolation
        run: >-
          node --import tsx --test
          src/templates/templateComponents.test.ts
          src/templates/templateMediaStorage.test.ts
          src/templates/templateMediaUploadAdmission.test.ts
          src/templates/templateMediaRoutesContract.test.ts
          src/templates/templateMediaPersistence.postgres.test.ts
          src/templates/templateMediaAccountUpload.postgres.test.ts
          src/services/templateProviderSubmissionGate.test.ts
          src/meta/metaTemplateMedia.test.ts
          src/campaigns/campaignSeedPrivacy.test.ts
      - name: Template media behavioral HTTP authorization and multipart tests
        run: >-
          node --import tsx --test
          --test-name-pattern "template media routes enforce|template media multipart rejects"
          src/http/campaignsFeatureRoutes.test.ts
      - name: Frontend timeout, re-entry and CRM CSV UX contract tests
        working-directory: .
        run: |
          apps/whatsapp-agent/node_modules/.bin/tsx --test \
            src/lib/crmImportRecovery.test.ts \
            src/lib/crmContactsInitialLoad.test.ts \
            src/lib/crmContactsCursorHistory.test.ts \
            src/lib/screenProcessing.test.ts \
            src/lib/templateMediaOverlay.test.ts \
            src/lib/templateMediaUx.test.ts
          apps/whatsapp-agent/node_modules/.bin/tsx --test \
            --test-name-pattern "CRM contacts expose progress|CRM initial list|CRM list uses cursor" \
            src/app/app/crm/crmPageContract.test.ts
      - name: Campaign media composer and lifecycle contracts
        working-directory: .
        run: >-
          apps/whatsapp-agent/node_modules/.bin/tsx --test
          src/app/app/campaigns/campaignsPageContract.test.ts
          src/lib/campaignComposerLifecycle.test.ts
